<!DOCTYPE html>
<html>
<body>
<!-- Renders the CodeQuackers logo mark to PNGs at 180/192/512 and stores dataURLs on window.__out -->
<svg id="src" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <defs>
    <linearGradient id="duckBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FF8A1E"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>
  <circle cx="46" cy="12" r="8.5" fill="url(#duckBody)"/>
  <path d="M42.6 4.7 Q41.3 1.7 44.4 1.3 Q42.9 3 43.8 5.1 Z" fill="url(#duckBody)"/>
  <ellipse cx="47.9" cy="15.5" rx="2.5" ry="1.5" fill="#FF6B6B" opacity=".35"/>
  <path d="M53.6 9.4 Q60.4 9.3 60.5 11.6 Q60.6 13.9 53.6 13.8 Q52.2 11.6 53.6 9.4 Z" fill="#FF6B1A"/>
  <circle cx="49.1" cy="9.1" r="2.5" fill="#07090E"/>
  <circle cx="49.9" cy="8.2" r=".85" fill="#fff"/>
  <rect x="3" y="14" width="58" height="46" rx="15" fill="url(#badgeGrad)"/>
  <rect x="3" y="14" width="58" height="46" rx="15" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
  <path d="M22 29 L13 37 L22 45" fill="none" stroke="#1B0F02" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 29 L51 37 L42 45" fill="none" stroke="#1B0F02" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34.5 27 L29.5 47" fill="none" stroke="#1B0F02" stroke-width="5" stroke-linecap="round"/>
</svg>
<script>
  window.__out = {};
  (async () => {
    const xml = new XMLSerializer().serializeToString(document.getElementById('src'));
    const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml' }));
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    for (const size of [180, 192, 512]) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#07090E';
      g.fillRect(0, 0, size, size);
      const pad = size * 0.09;
      g.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
      window.__out[size] = c.toDataURL('image/png');
    }
    window.__done = true;
  })().catch(e => { window.__err = String(e); });
</script>
</body>
</html>
